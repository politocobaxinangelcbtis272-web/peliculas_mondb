{% extends "base.html" %}

{% block title %}Login - CinePlus{% endblock %}

{% block content %}
<div class="container-fluid vh-100">
    <div class="row h-100">
        <div class="col-md-8 p-0">
            <div id="carouselLogin" class="carousel slide h-100" data-bs-ride="carousel">
                <div class="carousel-inner h-100">
                    <div class="carousel-item active h-100">
                        <img src="{{ url_for('static', filename='images/marvel.jpg') }}" 
                             class="d-block w-55 h-100" 
                             alt="Marvel"
                             style="object-fit: cover;">
                    </div>
                    <div class="carousel-item h-100">
                        <img src="{{ url_for('static', filename='images/minecraft.jpeg') }}" 
                             class="d-block w-55 h-100" 
                             alt="Minecraft"
                             style="object-fit: cover;">
                    </div>
                    <div class="carousel-item h-100">
                        <img src="{{ url_for('static', filename='images/coco.jpg') }}" 
                             class="d-block w-75 h-100" 
                             alt="coco"
                             style="object-fit: cover;">
                    </div>
                    <div class="carousel-item h-100">
                        <img src="{{ url_for('static', filename='images/superman.jpg') }}" 
                             class="d-block w-75 h-100" 
                             alt="superman"
                             style="object-fit: cover;">
                    </div>
                    <div class="carousel-item h-100">
                        <img src="{{ url_for('static', filename='images/terro.jpg') }}" 
                             class="d-block w-75 h-100" 
                             alt="iT"
                             style="object-fit: cover;">
                    </div>
                    <div class="carousel-item h-100">
                        <img src="{{ url_for('static', filename='images/zootopia.webp') }}" 
                             class="d-block w-100 h-100" 
                             alt="zootopia 1"
                             style="object-fit: cover;">
                    </div>
                    <div class="carousel-item h-100">
                        <img src="{{ url_for('static', filename='images/rey leon.webp') }}" 
                             class="d-block w-75 h-100" 
                             alt="El rey leon animacion"
                             style="object-fit: cover;">
                    </div>
                    <div class="carousel-item h-100">
                        <img src="{{ url_for('static', filename='images/spiderman 2021.jpeg') }}" 
                             class="d-block w-75 h-100" 
                             alt="spiderman:No Way Home"
                             style="object-fit: cover;">
                    </div>
                    <div class="carousel-item h-100">
                        <img src="{{ url_for('static', filename='images/spiderman 2.jpeg') }}" 
                             class="d-block w-75 h-100" 
                             alt="spiderman 2"
                             style="object-fit: cover;">
                    </div>
                    <div class="carousel-item h-100">
                        <img src="{{ url_for('static', filename='images/rey leon 2019.webp') }}" 
                             class="d-block w-75 h-100" 
                             alt=" El rey leon live action"
                             style="object-fit: cover;">
                    </div>
                    <div class="carousel-item h-100">
                        <img src="{{ url_for('static', filename='images/pinguino de madagascar.jpg') }}" 
                             class="d-block w-75 h-100" 
                             alt="pinguino de madagascar"
                             style="object-fit: cover;">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselLogin" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselLogin" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

        <div class="col-md-4 d-flex align-items-center justify-content-center">
            <div class="card shadow-lg border-0 w-100" style="max-width: 400px; margin: 20px;">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h2 class="card-title text-primary mb-2">
                            <i class="fas fa-film me-2"></i>CinePlus
                        </h2>
                        <p class="text-muted">Tus películas favorito</p>
                    </div>
                    
                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label">👤 Usuario</label>
                            <input type="text" class="form-control form-control-lg" name="username" required 
                                   placeholder="Ingresa tu usuario" autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">🔒 Contraseña</label>
                            <input type="password" class="form-control form-control-lg" name="password" required 
                                   placeholder="Ingresa tu contraseña">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Ingresar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
}

.carousel-item img {
    filter: brightness(0.7);
}

.card {
    backdrop-filter: blur(10px);
    background: rgba(255, 255, 255, 0.95);
}

.vh-100 {
    height: 100vh !important;
}

.h-100 {
    height: 100% !important;
}
</style>
{% endblock %}
